<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDnet適時開示分析</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'メイリオ', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .update-info {
            color: #666;
            font-size: 14px;
        }

        /* タブスタイル */
        .controls-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .controls-container > * {
            margin-bottom: 10px;
        }
        
        .controls-container > *:last-child {
            margin-bottom: 0;
        }

        .date-select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            background: white;
            color: #333;
            cursor: pointer;
            display: block;
            width: auto;
            min-width: 200px;
        }

        .date-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .market-tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .sentiment-tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .control-label {
            display: block;
            margin: 16px 0 8px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .sentiment-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 0;
            padding: 9px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #f8fafc;
            color: #475569;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .sentiment-tab:hover, .tab-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.10);
        }

        .sentiment-tab.active {
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
        }

        .sentiment-tab[data-sentiment="positive"].active {
            background: #168653;
        }

        .sentiment-tab[data-sentiment="neutral"].active {
            background: #64748b;
        }

        .sentiment-tab[data-sentiment="negative"].active {
            background: #cf3f4f;
        }

        .tab-count {
            min-width: 18px;
            padding: 2px 5px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.07);
            color: inherit;
            font-size: 11px;
            text-align: center;
        }

        .sentiment-tab.active .tab-count {
            background: rgba(255, 255, 255, 0.22);
        }

        .filter-note {
            margin-top: 12px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        .tab-button {
            padding: 8px 13px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #f8fafc;
            color: #475569;
            transition: all 0.2s ease;
        }

        .tab-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .disclosures {
            display: none;
        }

        .disclosures.active {
            display: block;
        }

        /* プルトゥリフレッシュ */
        .pull-to-refresh {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: top 0.3s ease;
            z-index: 1000;
        }

        .pull-to-refresh.visible {
            top: 20px;
        }

        .pull-to-refresh.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid;
        }

        .positive .section-header {
            border-color: #27ae60;
        }

        .neutral .section-header {
            border-color: #94a3b8;
        }

        .negative .section-header {
            border-color: #e74c3c;
        }

        .section-icon {
            font-size: 1.5em;
            margin-right: 15px;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: bold;
        }

        .positive .section-title {
            color: #27ae60;
        }

        .neutral .section-title {
            color: #64748b;
        }

        .negative .section-title {
            color: #e74c3c;
        }

        .disclosure-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .disclosure-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .ir-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .ir-item:last-child {
            border-bottom: none;
        }

        .ir-item:first-child {
            padding-top: 0;
        }

        .positive .disclosure-item {
            border-color: #27ae60;
            background: linear-gradient(to right, rgba(39, 174, 96, 0.05), transparent);
        }

        .negative .disclosure-item {
            border-color: #e74c3c;
            background: linear-gradient(to right, rgba(231, 76, 60, 0.05), transparent);
        }

        .neutral .disclosure-item {
            border-color: #94a3b8;
            background: linear-gradient(to right, rgba(100, 116, 139, 0.07), transparent);
        }

        .disclosure-header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .company-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .stock-code {
            background: #2c5364;
            color: white;
            padding: 4px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .stock-code:hover {
            background: #1a3545;
            text-decoration: none;
        }

        .company-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .time {
            color: #666;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .title {
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .reason {
            color: #666;
            font-size: 13px;
            padding: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 5px;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 16px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        /* レスポンシブデザイン（スマホ対応） */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.4em;
                margin-bottom: 10px;
            }

            .update-info {
                font-size: 12px;
            }

            #refreshButton {
                padding: 8px 16px;
                font-size: 13px;
                margin-top: 10px;
            }

            .sentiment-tab {
                gap: 4px;
                min-width: 0;
                padding: 8px 4px;
                font-size: 12px;
                white-space: nowrap;
            }
            
            .tab-button {
                min-width: 0;
                padding: 8px 4px;
                font-size: 12px;
                white-space: nowrap;
            }

            .tab-count {
                min-width: 16px;
                padding: 2px 4px;
                font-size: 10px;
            }

            .section {
                padding: 15px;
            }

            .controls-container {
                padding: 14px;
            }

            .section-header {
                margin-bottom: 15px;
            }

            .section-icon {
                font-size: 1.5em;
                margin-right: 10px;
            }

            .section-title {
                font-size: 1.2em;
            }

            .disclosure-item {
                padding: 12px;
            }

            .disclosure-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .company-info {
                flex-wrap: wrap;
            }

            .stock-code {
                font-size: 13px;
                padding: 3px 10px;
            }

            .company-name {
                font-size: 14px;
            }

            .time {
                font-size: 12px;
            }

            .title {
                font-size: 13px;
            }

            .reason {
                font-size: 12px;
            }
        }
    
    </style>
</head>

                }
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!isPulling) return;

            const pullDistance = currentY - startY;

            if (pullDistance > pullThreshold) {
                // リフレッシュ実行
                pullIndicator.classList.add('loading');
                
                // ページをリロード
                setTimeout(() => {
                    window.location.reload();
                }, 300);
            } else {
                // インジケータを非表示
                pullIndicator.classList.remove('visible');
            }

            isPulling = false;
        });
    </script>
</body>
</html>
